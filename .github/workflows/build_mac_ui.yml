name: Build Flutter UI for macOS

on:
  push:
    branches:
      - macOs
  workflow_dispatch:

jobs:
  build-macos-ui:
    runs-on: macos-latest

    steps:
      - name: Checkout UI Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tmax_back
          path: tmax_back
          ref: macOs
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}


      - name: Build macOS Backend Binary
        run: |
          if [ -d "tmax_back/Backend" ]; then
            cd tmax_back/Backend
            SDKPATH=$(xcrun --sdk macosx --show-sdk-path)
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-arch arm64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch arm64 -isysroot $SDKPATH" go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_arm64 main.go
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch x86_64 -isysroot $SDKPATH" go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_amd64 main.go || true
            if [ -f tmaxsrv_amd64 ]; then
              lipo -create -output tmaxsrv_mac tmaxsrv_amd64 tmaxsrv_arm64
            else
              mv tmaxsrv_arm64 tmaxsrv_mac
            fi
            chmod +x tmaxsrv_mac
          else
            echo "Error: tmax_back/Backend directory not found!"
            exit 1
          fi

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App Bundle
        run: flutter build macos --release --target-platform macos-x64,macos-arm64 -v

      - name: Embed Backend Binary into App Resources
        run: |
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          echo "Target App Bundle Path: $APP_PATH"
          RESOURCES_PATH="$APP_PATH/Contents/Resources"
          mkdir -p "$RESOURCES_PATH"
          if [ -f "tmax_back/Backend/tmaxsrv_mac" ]; then
            cp tmax_back/Backend/tmaxsrv_mac "$RESOURCES_PATH/tmaxsrv_mac"
            chmod +x "$RESOURCES_PATH/tmaxsrv_mac"
            echo "Successfully embedded tmaxsrv_mac into $RESOURCES_PATH"
          else
            echo "Error: tmaxsrv_mac not found at tmax_back/Backend/tmaxsrv_mac!"
            exit 1
          fi


      - name: Sign macOS App Bundle (Ad-Hoc)
        run: |
          cd build/macos/Build/Products/Release/
          codesign --force --deep --sign - *.app

      - name: Package App Bundle & Launcher Script into ZIP
        run: |
          cd build/macos/Build/Products/Release/
          APP_NAME=$(basename *.app)
          echo "Packaging App Bundle: $APP_NAME"
          
          # 创建一键解除隔离属性与签名限制的动态启动脚本
          cat << 'EOF' > 启动应用.command
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          TARGET_APP=$(ls -d "$DIR"/*.app 2>/dev/null | head -n 1)
          if [ -n "$TARGET_APP" ]; then
            echo "正在解除 macOS 安全隔离属性与签名限制..."
            xattr -cr "$TARGET_APP" 2>/dev/null
            codesign --force --deep --sign - "$TARGET_APP" 2>/dev/null
            echo "正在启动应用..."
            open "$TARGET_APP"
          else
            echo "错误: 未找到 .app 应用包"
          fi
          EOF
          chmod +x 启动应用.command

          # 打包包含 App 和一键启动脚本的 ZIP
          zip -r TMaxPcServiceUI-macOS.zip "$APP_NAME" 启动应用.command

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMaxPcServiceUI-macOS-App
          path: build/macos/Build/Products/Release/TMaxPcServiceUI-macOS.zip


