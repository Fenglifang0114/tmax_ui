name: Build Flutter UI for macOS

on:
  push:
    branches:
      - macOs
  workflow_dispatch:

jobs:
  build-macos-ui:
    runs-on: macos-latest

    steps:
      - name: Checkout UI Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tmax_back
          path: tmax_back
          ref: macOs
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}


      - name: Build macOS Backend Binary
        run: |
          if [ -d "tmax_back/Backend" ]; then
            cd tmax_back/Backend
            SDKPATH=$(xcrun --sdk macosx --show-sdk-path)
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-arch arm64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch arm64 -isysroot $SDKPATH" go build -ldflags="-s -w -X 'main.Version=v1.82'" -o tmaxsrv_arm64 main.go
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch x86_64 -isysroot $SDKPATH" go build -ldflags="-s -w -X 'main.Version=v1.82'" -o tmaxsrv_amd64 main.go || true
            chmod +x tmaxsrv_arm64 tmaxsrv_amd64
          else
            echo "Error: tmax_back/Backend directory not found!"
            exit 1
          fi

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App Bundle
        run: flutter build macos --release -v

      - name: Package App Bundles for Apple Silicon & Intel
        run: |
          BUILD_DIR="build/macos/Build/Products/Release"
          APP_PATH=$(ls -d $BUILD_DIR/*.app | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          RESOURCES_PATH="$APP_PATH/Contents/Resources"
          mkdir -p "$RESOURCES_PATH"

          # 1. 打包 Apple Silicon (M1/M2/M3/M4) 版本
          cp tmax_back/Backend/tmaxsrv_arm64 "$RESOURCES_PATH/tmaxsrv_mac"
          chmod +x "$RESOURCES_PATH/tmaxsrv_mac"
          codesign --force --deep --sign - "$APP_PATH"
          cd $BUILD_DIR
          zip -r -9 TMaxPcServiceUI-macOS-AppleSilicon-M1-M4.zip "$APP_NAME" -x "*.dSYM*"
          cd -

          # 2. 打包 Intel 芯片版本
          if [ -f "tmax_back/Backend/tmaxsrv_amd64" ]; then
            cp tmax_back/Backend/tmaxsrv_amd64 "$RESOURCES_PATH/tmaxsrv_mac"
            chmod +x "$RESOURCES_PATH/tmaxsrv_mac"
            codesign --force --deep --sign - "$APP_PATH"
            cd $BUILD_DIR
            zip -r -9 TMaxPcServiceUI-macOS-Intel.zip "$APP_NAME" -x "*.dSYM*"
            cd -
          fi

      - name: Upload Apple Silicon App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMaxPcServiceUI-macOS-AppleSilicon-M1-M4
          path: build/macos/Build/Products/Release/TMaxPcServiceUI-macOS-AppleSilicon-M1-M4.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMaxPcServiceUI-macOS-Intel
          path: build/macos/Build/Products/Release/TMaxPcServiceUI-macOS-Intel.zip

      - name: Generate Fast Direct Download Links
        run: |
          cd build/macos/Build/Products/Release/
          URL_ARM64=$(curl -s --upload-file TMaxPcServiceUI-macOS-AppleSilicon-M1-M4.zip https://transfer.sh/TMaxPcServiceUI-macOS-AppleSilicon-M1-M4.zip || true)
          URL_INTEL=$(curl -s --upload-file TMaxPcServiceUI-macOS-Intel.zip https://transfer.sh/TMaxPcServiceUI-macOS-Intel.zip || true)
          echo "### 🚀 国内极速直连下载地址 (Fast Direct Download Links):" >> $GITHUB_STEP_SUMMARY
          if [ -n "$URL_ARM64" ]; then
            echo "- **Apple Silicon (M1/M2/M3/M4)**: [$URL_ARM64]($URL_ARM64)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$URL_INTEL" ]; then
            echo "- **Intel 芯片**: [$URL_INTEL]($URL_INTEL)" >> $GITHUB_STEP_SUMMARY
          fi


