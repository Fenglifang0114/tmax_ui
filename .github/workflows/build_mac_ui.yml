name: Build Flutter UI for macOS

on:
  push:
    branches:
      - macOs
  workflow_dispatch:

jobs:
  build-macos-ui:
    runs-on: macos-latest

    steps:
      - name: Checkout UI Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tmax_back
          path: tmax_back
          ref: macOs
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}


      - name: Build macOS Backend Binary & Dynamic Library
        run: |
          if [ -d "tmax_back/Backend" ]; then
            cd tmax_back/Backend
            SDKPATH=$(xcrun --sdk macosx --show-sdk-path)
            # 1. 编译可执行二进制文件
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-arch arm64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch arm64 -isysroot $SDKPATH" go build -ldflags="-s -w -X 'main.Version=v1.82'" -o tmaxsrv_arm64 main.go
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch x86_64 -isysroot $SDKPATH" go build -ldflags="-s -w -X 'main.Version=v1.82'" -o tmaxsrv_amd64 main.go || true
            if [ -f tmaxsrv_amd64 ]; then
              lipo -create -output tmaxsrv_mac tmaxsrv_amd64 tmaxsrv_arm64
            else
              mv tmaxsrv_arm64 tmaxsrv_mac
            fi
            chmod +x tmaxsrv_mac

            # 2. 编译 C-Shared 动态链接库 (.dylib)
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-arch arm64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch arm64 -isysroot $SDKPATH" go build -buildmode=c-shared -ldflags="-s -w -X 'main.Version=v1.82'" -o libtmaxsrv_arm64.dylib .
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64 -isysroot $SDKPATH" CGO_LDFLAGS="-arch x86_64 -isysroot $SDKPATH" go build -buildmode=c-shared -ldflags="-s -w -X 'main.Version=v1.82'" -o libtmaxsrv_amd64.dylib . || true
            if [ -f libtmaxsrv_amd64.dylib ]; then
              lipo -create -output libtmaxsrv.dylib libtmaxsrv_amd64.dylib libtmaxsrv_arm64.dylib
            else
              mv libtmaxsrv_arm64.dylib libtmaxsrv.dylib
            fi
          else
            echo "Error: tmax_back/Backend directory not found!"
            exit 1
          fi

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App Bundle
        run: flutter build macos --release -v

      - name: Embed Backend Binary & Dynamic Library into App Bundle
        run: |
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          echo "Target App Bundle Path: $APP_PATH"
          RESOURCES_PATH="$APP_PATH/Contents/Resources"
          FRAMEWORKS_PATH="$APP_PATH/Contents/Frameworks"
          mkdir -p "$RESOURCES_PATH"
          mkdir -p "$FRAMEWORKS_PATH"
          if [ -f "tmax_back/Backend/tmaxsrv_mac" ]; then
            cp tmax_back/Backend/tmaxsrv_mac "$RESOURCES_PATH/tmaxsrv_mac"
            chmod +x "$RESOURCES_PATH/tmaxsrv_mac"
            echo "Successfully embedded tmaxsrv_mac into $RESOURCES_PATH"
          fi
          if [ -f "tmax_back/Backend/libtmaxsrv.dylib" ]; then
            cp tmax_back/Backend/libtmaxsrv.dylib "$FRAMEWORKS_PATH/libtmaxsrv.dylib"
            cp tmax_back/Backend/libtmaxsrv.dylib "$RESOURCES_PATH/libtmaxsrv.dylib"
            echo "Successfully embedded libtmaxsrv.dylib into $FRAMEWORKS_PATH and $RESOURCES_PATH"
          else
            echo "Error: libtmaxsrv.dylib not found at tmax_back/Backend/libtmaxsrv.dylib!"
            exit 1
          fi

      - name: Sign macOS App Bundle (Ad-Hoc)
        run: |
          cd build/macos/Build/Products/Release/
          codesign --force --deep --sign - *.app

      - name: Package App Bundle with 7z Ultra Compression
        run: |
          cd build/macos/Build/Products/Release/
          APP_NAME=$(basename *.app)
          echo "Packaging App Bundle with 7z LZMA2 ultra compression: $APP_NAME"
          7z a -t7z -m0=lzma2 -mx=9 TMaxPcServiceUI-macOS.7z "$APP_NAME" -xr!"*.dSYM*"

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMaxPcServiceUI-macOS-App
          path: build/macos/Build/Products/Release/TMaxPcServiceUI-macOS.7z

      - name: Generate Fast Direct Download Link
        run: |
          cd build/macos/Build/Products/Release/
          TRANSFER_URL=$(curl -s --upload-file TMaxPcServiceUI-macOS.7z https://transfer.sh/TMaxPcServiceUI-macOS.7z || true)
          if [ -n "$TRANSFER_URL" ]; then
            echo "### 🚀 国内极速直连下载地址 (Fast Direct Download Link):" >> $GITHUB_STEP_SUMMARY
            echo "[$TRANSFER_URL]($TRANSFER_URL)" >> $GITHUB_STEP_SUMMARY
            echo "Fast Download Link: $TRANSFER_URL"
          fi


