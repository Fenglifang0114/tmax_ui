  uses-material-design: true
  

  fonts:
    - family: msyh
      fonts:
        - asset: fonts/msyh.ttc
    # - family: simhei
    #   fonts:    
    #     - asset: fonts/simhei.ttf
    # - family: STSONG
    #   fonts:    
